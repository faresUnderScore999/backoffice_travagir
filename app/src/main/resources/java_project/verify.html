<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Google Auth Bridge</title>
    <style>
        :root{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#111827}
        body{margin:0;background:linear-gradient(180deg,#f8fafc,#fff);height:100vh;display:flex;align-items:center;justify-content:center}
        .page{width:100%;max-width:520px;padding:20px}
        .card{background:#ffffff;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.08);padding:28px;border:1px solid rgba(15,23,42,0.04)}
        /* Branding: use trrabagir + Amazon-like palette */
        .brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
        .brand img{height:46px;opacity:0.98;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.08))}
        .brand h1{font-size:20px;margin:0;color:#131921;font-weight:800}
        .actions{display:flex;flex-direction:column;gap:12px;align-items:center}
        /* Amazon-like orange accent */
        button.primary{background:#FF9900;color:#111;padding:10px 18px;border-radius:8px;border:none;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(255,153,0,0.12)}
        .hint{font-size:13px;color:#6b7280;text-align:center}
        .profile-card{display:flex;flex-direction:column;gap:16px}
        .profile-top{display:flex;gap:12px;align-items:center}
        .avatar{width:72px;height:72px;border-radius:36px;object-fit:cover;border:2px solid rgba(15,23,42,0.06)}
        .title h2{margin:0;font-size:18px;color:#131921}
        .title .sub{font-size:12px;color:#6b7280}
        .profile-body p{margin:4px 0;color:#111827}
        .profile-actions{display:flex;justify-content:flex-end}
        button.secondary{background:transparent;border:1px solid #e5e7eb;padding:8px 12px;border-radius:8px;cursor:pointer}
    </style>
</head>
<body>
    <div class="page">
        <div class="card" id="ui-content">
            <div class="brand">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGEYY5AtdlHbVvAHsKt0MyQXaApEmdgsVRvA&s" alt="travagir logo"/>
                <h1>travagir</h1>
            </div>

            <div class="actions">
                <button id="auth-btn" class="primary">Sign in with Google</button>
                <div class="hint">This opens Google sign-in and returns an access token to your app.</div>
            </div>
        </div>
    </div>

    <script>
        const client_id = "98979350710-n906t7nunrdblbdr58m1gd49gro70h0j.apps.googleusercontent.com";
        const redirect_uri = "http://localhost:8087/verifyme"; // must match server

        function startAuth() {
            const scope = "email profile";
            const response_type = "token"; // implicit flow -> token in fragment
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${client_id}&redirect_uri=${encodeURIComponent(redirect_uri)}&scope=${encodeURIComponent(scope)}&response_type=${response_type}`;
            window.location.href = authUrl;
        }

        document.getElementById('auth-btn').addEventListener('click', startAuth);

        // Logic to run when Google redirects back with token in the URL fragment
        async function handleRedirect() {
            if (window.location.hash) {
                const params = new URLSearchParams(window.location.hash.substring(1));
                const token = params.get('access_token');
                if (token) {
                    try {
                        // Fetch user info from Google
                        const resp = await fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${token}`);
                        const data = await resp.json();

                        // Inform the local JavaFX app (server) about the token
                        try {
                            // notify server so Java app can also process/store the token
                            await fetch(`http://localhost:8087/verifyme?access_token=${encodeURIComponent(token)}`);
                        } catch (e) {
                            // best-effort notify; ignore errors
                            console.warn('Failed to notify local server', e);
                        }

                        // Render profile info
                        document.getElementById('ui-content').innerHTML = `
                            <div class="profile-card">
                                <div class="profile-top">
                                    <img src="${data.picture || ''}" alt="Profile" class="avatar"/>
                                    <div class="title">
                                        <h2>Signed in</h2>
                                        <div class="sub">Token verified via Google API</div>
                                    </div>
                                </div>
                                <div class="profile-body">
                                    <p><strong>Name:</strong> ${data.name || 'n/a'}</p>
                                    <p><strong>Email:</strong> ${data.email || 'n/a'}</p>
                                </div>
                                <div class="profile-actions">
                                    <button id="logout" class="secondary">Logout / Clear</button>
                                </div>
                            </div>
                        `;

                        document.getElementById('logout').addEventListener('click', () => {
                            // clear fragment and reload to reset
                            window.location.hash = '';
                            window.location.href = redirect_uri.replace('/verifyme','/');
                        });

                    } catch (err) {
                        document.getElementById('ui-content').innerText = 'Failed to fetch profile: ' + err;
                    }
                }
            }
        }

        // run on load
        handleRedirect();
    </script>
</body>
</html>
